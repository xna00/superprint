name: Build and Upload

on: [push, workflow_dispatch]

env:
  NODE_VERSION: '24'

jobs:
  build-all:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Type check (all workspaces)
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: all-build-artifacts
          path: |
            server/dist/
            api/index.js
            api/index.d.ts
            web/dist/

      - name: Smoke test QuickSuperPrint_Setup.exe (download + file check)
        run: |
          cd printdriver-quickwin
          # 这个自检要从 CI（境外）下载生产上的 ~1.5MB exe：直连源站那条 URL 基本必然
          # 30s 超时，只能指望 CF 那条能在 30s 内拉完 → 跨境抖动会误报（#427 第一次 attempt）。
          # 抖动重试，最多 3 次；真坏（404 / 文件被删 / 源站挂）是确定性的，三次都会失败。
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "[smoke] attempt $i/$attempts starting at $(Get-Date -Format 'HH:mm:ss')"
            Remove-Item selftest.txt -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath dist\QuickSuperPrint_Setup.exe -ArgumentList '-o','selftest.txt','--selftest' -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 5
              if (Test-Path selftest.txt) {
                Write-Host "[smoke] selftest.txt so far at $(Get-Date -Format 'HH:mm:ss'):"
                Get-Content selftest.txt -Raw
              }
            }
            if (-not $p.HasExited) {
              Write-Host "[smoke] TIMEOUT after 90s, killing process..."
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit()
            } else {
              Write-Host "[smoke] process exited, exit code $($p.ExitCode)"
            }
            Write-Host "=== selftest.txt (attempt $i) ==="
            if (Test-Path selftest.txt) { Get-Content selftest.txt -Raw } else { Write-Host "(selftest.txt not created)" }
            $ok = ($p.ExitCode -eq 0) -and (Test-Path selftest.txt) -and (Select-String -Path selftest.txt -Pattern 'selftest: downloaded=true' -Quiet)
            if ($ok) { Write-Host "[smoke] OK on attempt $i/$attempts"; exit 0 }
            Write-Host "[smoke] attempt $i failed"
            if ($i -lt $attempts) { Start-Sleep -Seconds 5 }
          }
          Write-Host "[smoke] all $attempts attempts failed"
          exit 1

      - name: Verify install flow (Setup.exe --install-only)
        run: |
          # --install-only 跑完整安装（下载+落盘+快捷方式+开机自启）但不启动程序、不弹窗，
          # 退出码反映安装结果。--selftest 只覆盖「CDN 能不能拉到 exe」；这一条覆盖
          # mkdir / IShellLink / IPersistFile::Save 整条链——CoCreateInstance 漏 pUnkOuter 槽、
          # GetFileAttributes 的 0xFFFFFFFF 当 -1 两处回归都落在这里，而之前 CI 完全没管。
          cd printdriver-quickwin
          $expect = @(
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\超人打印\超人打印.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\超人打印\卸载.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\超人打印\更新.lnk",
            "$env:USERPROFILE\Desktop\超人打印.lnk",
            "$env:LOCALAPPDATA\SuperPrint\install.log"
          )
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "[install] attempt $i/$attempts starting at $(Get-Date -Format 'HH:mm:ss')"
            # 清干净：残留的 .lnk 会让断言假阳性，把回归放过去
            Remove-Item "$env:LOCALAPPDATA\SuperPrint" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\超人打印" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "$env:USERPROFILE\Desktop\超人打印.lnk" -Force -ErrorAction SilentlyContinue
            Remove-Item install.txt -ErrorAction SilentlyContinue

            $p = Start-Process -FilePath dist\QuickSuperPrint_Setup.exe -ArgumentList '-o','install.txt','--install-only' -PassThru
            $deadline = (Get-Date).AddSeconds(180)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 5
            }
            if (-not $p.HasExited) {
              Write-Host "[install] TIMEOUT after 180s, killing process..."
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit()
            } else {
              Write-Host "[install] process exited, exit code $($p.ExitCode)"
            }
            Write-Host "=== install.txt (attempt $i) ==="
            if (Test-Path install.txt) { Get-Content install.txt -Raw } else { Write-Host "(install.txt not created)" }
            $log = "$env:LOCALAPPDATA\SuperPrint\install.log"
            Write-Host "=== install.log ==="
            if (Test-Path $log) { Get-Content $log -Raw } else { Write-Host "(install.log not created)" }

            $fail = 0
            if ($p.ExitCode -ne 0) { Write-Host "[install] non-zero exit code $($p.ExitCode)"; $fail = 1 }
            foreach ($f in $expect) {
              if (Test-Path $f) { Write-Host "OK: $f" } else { Write-Host "MISSING: $f"; $fail = 1 }
            }
            if ($fail -eq 0) { Write-Host "[install] OK on attempt $i/$attempts"; exit 0 }
            Write-Host "[install] attempt $i failed"
            if ($i -lt $attempts) { Start-Sleep -Seconds 5 }
          }
          Write-Host "[install] all $attempts attempts failed"
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: quickwin-artifacts
          path: printdriver-quickwin/dist/

  notify:
    needs: [build-all]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # 服务器自己 git pull + npm run deploy，构建产物不上行；
      # 跨境只走这个毫秒级的通知。
      # 必须经过 Cloudflare（superprint.xna00.top）：CI 直连源站 443 的
      # 跨境链路根本建不起来（实测连请求都到不了源站）。
      - name: Notify server to deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "token: $DEPLOY_TOKEN" \
            "https://superprint.xna00.top/api/deployHint/_outDeployHint"
          echo
          echo "已通知服务器部署（202 = 已受理；进度见服务器上的 deploy.log）"

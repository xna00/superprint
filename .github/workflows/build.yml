name: Build and Upload

on: [push, workflow_dispatch]

env:
  NODE_VERSION: '24'

jobs:
  build-all:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: all-build-artifacts
          path: |
            server/dist/
            api/__types__/
            api/index.js
            api/index.d.ts
            web/dist/

      - name: Smoke test QuickSuperPrint_Setup.exe (download + file check)
        run: |
          cd printdriver-quickwin
          # 这个自检要从 CI（境外）下载生产上的 ~1.5MB exe：直连源站那条 URL 基本必然
          # 30s 超时，只能指望 CF 那条能在 30s 内拉完 → 跨境抖动会误报（#427 第一次 attempt）。
          # 抖动重试，最多 3 次；真坏（404 / 文件被删 / 源站挂）是确定性的，三次都会失败。
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "[smoke] attempt $i/$attempts starting at $(Get-Date -Format 'HH:mm:ss')"
            Remove-Item selftest.txt -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath dist\QuickSuperPrint_Setup.exe -ArgumentList '-o','selftest.txt','--selftest' -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 5
              if (Test-Path selftest.txt) {
                Write-Host "[smoke] selftest.txt so far at $(Get-Date -Format 'HH:mm:ss'):"
                Get-Content selftest.txt -Raw
              }
            }
            if (-not $p.HasExited) {
              Write-Host "[smoke] TIMEOUT after 90s, killing process..."
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit()
            } else {
              Write-Host "[smoke] process exited, exit code $($p.ExitCode)"
            }
            Write-Host "=== selftest.txt (attempt $i) ==="
            if (Test-Path selftest.txt) { Get-Content selftest.txt -Raw } else { Write-Host "(selftest.txt not created)" }
            $ok = ($p.ExitCode -eq 0) -and (Test-Path selftest.txt) -and (Select-String -Path selftest.txt -Pattern 'selftest: downloaded=true' -Quiet)
            if ($ok) { Write-Host "[smoke] OK on attempt $i/$attempts"; exit 0 }
            Write-Host "[smoke] attempt $i failed"
            if ($i -lt $attempts) { Start-Sleep -Seconds 5 }
          }
          Write-Host "[smoke] all $attempts attempts failed"
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: quickwin-artifacts
          path: printdriver-quickwin/dist/

  build-printdriver:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache innosetup
        id: cache-innosetup
        uses: actions/cache@v5
        with:
          path: C:\Program Files (x86)\Inno Setup 5
          key: ${{ runner.os }}-innosetup-5.6.1

      - name: Install Inno Setup
        if: steps.cache-innosetup.outputs.cache-hit != 'true'
        run: |
          choco install innosetup --version 5.6.1 -y --allow-downgrade

      - name: Cache CMake build
        id: cache-cmake
        uses: actions/cache@v5
        with:
          path: printdriver/build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('printdriver/src/**', 'printdriver/CMakeLists.txt', 'printdriver/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v5
        with:
          path: |
            vcpkg
            printdriver/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-x64-windows-static-${{ hashFiles('printdriver/vcpkg.json') }}

      - name: Cache printdriver output
        id: cache-printdriver
        uses: actions/cache@v5
        with:
          path: printdriver/output
          key: ${{ runner.os }}-printdriver-output-${{ hashFiles('printdriver/src/**', 'printdriver/CMakeLists.txt', 'printdriver/vcpkg.json', 'printdriver/cert/**', 'printdriver/installer/**', 'printdriver/scripts/**') }}

      - name: Setup vcpkg
        if: steps.cache-printdriver.outputs.cache-hit != 'true' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: printdriver/vcpkg.json
          doNotCache: false
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static

      - name: Install vcpkg manifest deps (explicit)
        if: steps.cache-printdriver.outputs.cache-hit != 'true' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          cd printdriver
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install --triplet x64-windows-static

      - name: Configure and Build CMake
        if: steps.cache-printdriver.outputs.cache-hit != 'true'
        run: |
          cd printdriver
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="../vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="$PWD\vcpkg_installed"
          cmake --build build --config Release

      - name: Prepare output files
        if: steps.cache-printdriver.outputs.cache-hit != 'true'
        run: |
          cd printdriver
          mkdir output -Force
          copy build\Release\PrintDriver.exe output\PrintDriver.exe
          copy build\Release\Setup.exe output\Setup.exe
          Write-Host "Copied exe files from CMake build"

      - name: Sign executables
        if: steps.cache-printdriver.outputs.cache-hit != 'true'
        run: |
          $pfxPath = "printdriver\cert\PrintDriver.pfx"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
            
          Write-Host "Signing PrintDriver.exe..."
          & $signtool.FullName sign /f $pfxPath /p "PrintDriver2024" /fd sha256 "printdriver\output\PrintDriver.exe"
            
          Write-Host "Signing Setup.exe..."
          if (Test-Path "printdriver\output\Setup.exe") {
            & $signtool.FullName sign /f $pfxPath /p "PrintDriver2024" /fd sha256 "printdriver\output\Setup.exe"
          }

      - name: Generate version info
        if: steps.cache-printdriver.outputs.cache-hit != 'true'
        run: |
          cd printdriver
          $versionLine = Select-String -Path "CMakeLists.txt" -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          if ($versionLine) {
            $version = $versionLine.Matches.Groups[1].Value
            $json = @{
              version = $version
              exe = 'PrintDriver.exe'
              setupexe = 'Setup.exe'
            } | ConvertTo-Json -Depth 3
            [System.IO.File]::WriteAllText("$PWD\output\printdriver.json", $json, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Generated printdriver.json with version $version"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: printdriver-artifacts
          path: printdriver/output/

  notify:
    needs: [build-all, build-printdriver]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # 服务器自己 git pull + npm run deploy，构建产物不上行；
      # 跨境只走这个毫秒级的通知。
      # 必须经过 Cloudflare（superprint.xna00.top）：CI 直连源站 443 的
      # 跨境链路根本建不起来（实测连请求都到不了源站）。
      - name: Notify server to deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "token: $DEPLOY_TOKEN" \
            "https://superprint.xna00.top/api/deployHint/_outDeployHint"
          echo
          echo "已通知服务器部署（202 = 已受理；进度见服务器上的 deploy.log）"
